# Runs on every pull request: nothing merges unless tests, policy checks,
# and a reviewed terraform plan all pass.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write      # OIDC to AWS
  contents: read
  pull-requests: write # post the plan as a PR comment

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 pytest
      - run: pytest -q tests/

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate (no backend needed)
        run: |
          terraform init -backend=false
          terraform validate

      - name: Policy checks (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          soft_fail: false
          # Documented exceptions, each with a reason in README.md#policy-exceptions
          skip_check: CKV_AWS_117,CKV_AWS_116,CKV_AWS_173,CKV_AWS_272,CKV_AWS_158,CKV_AWS_338,CKV_AWS_136,CKV_AWS_144,CKV_AWS_145,CKV_AWS_18,CKV2_AWS_61,CKV2_AWS_62

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Plan
        id: plan
        run: |
          echo "${{ vars.TF_BACKEND_HCL }}" > backend.hcl
          terraform init -backend-config=backend.hcl
          terraform plan -no-color -input=false -var="github_repo=${{ github.repository }}" -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const plan = require('fs').readFileSync('infra/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: "### Terraform plan\n```\n" + plan + "\n```",
            });
